<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البراء محمد بلال إسماعيل</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      margin: 0 auto 16px;
      border: 3px solid var(--accent);
    }
    h1 { font-size: 1.25rem; margin-bottom: 6px; }
    p.title { color: var(--subtext); font-size: 0.9rem; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #334155;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    .btn:hover { background: #475569; transform: translateY(-2px); }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
    }
    .btn-whatsapp { background: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">ا</div>
    <h1>البراء محمد بلال إسماعيل</h1>
    <p class="title">تقنية وتطوير برمجيات | حلول ذكية</p>

    <div class="links">
      <a href="contact.vcf" class="btn btn-primary" download>
        📇 حفظ جهة الاتصال مباشرة
      </a>

      <!-- عدل الرقم إلى رقم واتساب الخاص بك -->
      <a href="https://wa.me/963980448127" target="_blank" class="btn btn-whatsapp">
        💬 مراسلة عبر واتساب
      </a>

      <!-- عدل البريد الإلكتروني -->
      <a href="mailto:albaraaismail@gmail.com" class="btn">
        ✉️ إرسال بريد إلكتروني
      </a>

      <!-- حساب GitHub أو وسائل تواصل أخرى -->
      <a href="https://github.com" target="_blank" class="btn">
        💻 حساب GitHub والمشاريع
      </a>
    </div>
  </div>

</body>
</html>
